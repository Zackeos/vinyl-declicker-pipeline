name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and PortAudio
        # FFmpeg provides the filters the graph tests build against; PortAudio
        # is needed because audio_engine imports sounddevice at module level.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Show FFmpeg filters the project relies on
        run: ffmpeg -hide_banner -filters | grep -E " (adeclick|adeclip|afftdn) "

      - name: Run tests
        run: pytest tests -q
